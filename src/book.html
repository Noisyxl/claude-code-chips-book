<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bar:#f4f1ebe6;--bar-ink:#2b2620;--bar-muted:#8a8275;--card:#fbf9f4f2;--rule:#00000014;--clay:#d97757;--page-bg:#cfc6b6;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#2a2622e6;--bar-ink:#f1ebe0;--bar-muted:#a59d8f;--card:#2d2925f2;--rule:#ffffff1a;--page-bg:#1d1a17;color-scheme:dark}}
  :root[data-theme="dark"]{--bar:#2a2622e6;--bar-ink:#f1ebe0;--bar-muted:#a59d8f;--card:#2d2925f2;--rule:#ffffff1a;--page-bg:#1d1a17;color-scheme:dark}

    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 30px #0000002a,0 0 0 1px var(--rule);z-index:5;max-width:calc(100vw - 24px)}

  .cap{display:flex;align-items:center;gap:8px;min-width:230px;max-width:330px;padding:0 10px;font-size:14px;line-height:1.2}
  .cap .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dots{display:flex;gap:4px} .dots i{width:5px;height:5px;border-radius:50%;background:var(--bar-muted);opacity:.45} .dots i.on{opacity:1;background:var(--bar-ink);width:14px;border-radius:3px}
  .sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
  .menu{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;
    box-shadow:0 10px 40px #0000002e,0 0 0 1px var(--rule);padding:10px;min-width:300px;opacity:0;pointer-events:none;transition:.2s;z-index:6}

    box-shadow:0 8px 26px #00000040,inset 0 0 0 2px #ffffffcc,inset 0 0 18px #00000022;transform:translate(-50%,-50%)}
  #lens.on{opacity:1}
  #lens::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff55,transparent 45%)}
  .card{position:fixed;z-index:5;max-width:330px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:12px 15px 13px;
    box-shadow:0 10px 34px #00000030,0 0 0 1px var(--rule);opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none;font-size:15px;line-height:1.38}
  .card.on{opacity:1;transform:none}
  .card .k{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--clay);text-transform:uppercase;margin-bottom:6px}
  .card .h{font-weight:700;font-size:18px;margin-bottom:4px} .card p{margin:0 0 5px} .card code{font:12.5px "JetBrains Mono",monospace;background:var(--rule);padding:1px 4px;border-radius:4px}
  .intro{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;transition:opacity .5s}
  .intro h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em} .intro p{margin:3px 0 0;font-size:13px;color:var(--bar-muted)}
  .intro.gone{opacity:0}
  .hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:4;font:600 11px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
    background:var(--card);padding:8px 12px;border-radius:999px;box-shadow:0 4px 18px #00000022;transition:opacity .4s;pointer-events:none}

  .load.gone{opacity:0;pointer-events:none}
  @media (max-width:640px){.cap{min-width:0;max-width:44vw}.dots{display:none}.bar{bottom:12px;padding:4px}.bar button{width:30px;height:30px}.sep{display:none}
    .bar .opt{display:none}.menu{min-width:calc(100vw - 32px)} #lens{width:130px;height:130px}.hint{bottom:62px}}
</style>

<body>
<canvas id="c" aria-label="A 3D pop-up book about Claude Code agents and costs"></canvas>
<div class="load" id="load">OPENING THE BOOK…</div>
<div class="intro" id="intro"><h1>Claude Code Chips</h1><p>An unofficial pop-up field guide to agents, chips and the token bill</p></div>
<div class="hint" id="hint">Tap the cover to open</div>
<div id="lens"></div>
<div class="card" id="card"></div>
<div class="menu" id="menu"></div>
<div class="bar" id="bar">
  <button id="bMenu" title="Contents" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <button id="bPrev" title="Previous page" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="bPlay" title="Play the tour" aria-label="Play the tour"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/></svg></button>
  <div class="cap"><span class="t" id="capT">Claude Code Chips</span><span class="dots" id="dots"></span></div>

  <button id="bTheme" class="opt" title="Day / night" aria-label="Day or night"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg></button>
  <button id="bView" class="opt" title="Reset the view" aria-label="Reset the view"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Claude Code Chips: a pop-up book on a desk.
   Left page = the lesson (canvas text, predict, lift-the-flap). Right page = a pencil-hatched pop-up scene you tap.
   ============================================================ */
const MASCOT = '__MASCOT__';
const INK = '#2b2620', CLAY = '#d97757', PAPERC = '#fbfaf5';
const COL = { input:'#e0794f', output:'#8b5cf6', write:'#3b82f6', read:'#22c55e', gold:'#e9b949' };
const PW = 1.0, PH = 1.36, BASE_Y = 0.0755, SERIF = 'Newsreader, Georgia, "Times New Roman", serif', MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
const qs = new URLSearchParams(location.search);

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:qs.has('shot') });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .05, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = .6; controls.maxDistance = 7.5; controls.maxPolarAngle = 1.32; controls.enablePan = true;
controls.screenSpacePanning = true;

const hemi = new THREE.HemisphereLight(0xfff8ee, 0x8a9a92, .9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.1); sun.position.set(-2.6, 4.2, 2.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left:-2.6, right:2.6, top:2.6, bottom:-2.6, near:.5, far:12 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, .35); fill.position.set(3, 2, -2); scene.add(fill);

/* ---------- materials: pencil hatch ---------- */
const PR = renderer.getPixelRatio();
function hatchMat(color = PAPERC, opts = {}){
  const m = new THREE.MeshLambertMaterial({ color, transparent:!!opts.opacity, opacity:opts.opacity ?? 1, side:opts.side ?? THREE.FrontSide });
  m.onBeforeCompile = sh => {
    sh.uniforms.uInk = { value:new THREE.Color(INK) }; sh.uniforms.uPR = { value:PR }; sh.uniforms.uK = { value:opts.k ?? .86 };
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform vec3 uInk; uniform float uPR; uniform float uK;
      float hl(vec2 p, float a, float s, float w){ float v = p.x*cos(a) + p.y*sin(a); float d = abs(fract(v/s) - .5)*s; return 1. - smoothstep(w*.5, w*.5 + 1.1, d); }`)
    .replace('#include <opaque_fragment>', `
      float lum = clamp(dot(outgoingLight, vec3(.299,.587,.114)) / max(.001, dot(diffuseColor.rgb, vec3(.299,.587,.114))), 0., 1.6);
      vec2 sp = gl_FragCoord.xy / uPR;
      float h = 0.;
      if (lum < .92*uK) h = max(h, hl(sp, .785, 6.5, .55) * smoothstep(.92*uK, .70*uK, lum) * .55);
      if (lum < .66*uK) h = max(h, hl(sp, -.785, 6.5, .6) * smoothstep(.66*uK, .46*uK, lum) * .6);
      if (lum < .40*uK) h = max(h, hl(sp, 0., 4.2, .7) * .65);
      outgoingLight = mix(diffuseColor.rgb * (.86 + .14*min(lum, 1.)), uInk, h);
      #include <opaque_fragment>`);
  };
  return m;
}
const PAPER = hatchMat(), PAPER2 = hatchMat('#f1ede4'), LINEMAT = new THREE.LineBasicMaterial({ color:INK, transparent:true, opacity:.82 });
const GLASS = new THREE.MeshPhysicalMaterial({ color:0xffffff, transparent:true, opacity:.16, roughness:.08, transmission:0, depthWrite:false });
function inked(mesh, angle = 28){ const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle), LINEMAT); e.raycast = () => {}; mesh.add(e); return mesh; }
function shadowy(o, cast = true, recv = true){ o.traverse(c => { if (c.isMesh){ c.castShadow = cast; c.receiveShadow = recv; } }); return o; }
const M = (geo, mat = PAPER, ink = true, angle) => { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; if (ink) inked(m, angle); return m; };
const box  = (w,h,d,mat,r=0) => M(r ? new RoundedBoxGeometry(w,h,d,2,r) : new THREE.BoxGeometry(w,h,d), mat);
const cylg = (rt,rb,h,seg=28) => new THREE.CylinderGeometry(rt,rb,h,seg);
const at = (o, x, y, z) => (o.position.set(x, y, z), o);
const inkTube = (pts, r = .0035, mat) => { const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))); const m = new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(8, pts.length*6), r, 6, false), mat || new THREE.MeshBasicMaterial({ color:INK })); m.castShadow = true; return m; };
const ring = (r, tube = .0035, mat) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 6, 48), mat || new THREE.MeshBasicMaterial({ color:INK })); m.rotation.x = Math.PI/2; return m; };

/* ---------- canvas helpers ---------- */
function canvasTex(w, h, draw){ const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.userData = { cv, g, draw };
  t.redraw = fn => { g.clearRect(0,0,w,h); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; (fn || t.userData.draw)(g, w, h); t.needsUpdate = true; }; return t; }
function wrap(g, text, maxW){ const out = []; for (const para of String(text).split('\n')){ let line = ''; for (const w of para.split(' ')){ const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; } out.push(line); } return out; }
function paperBg(g, w, h, tint = '#fbfaf5'){ g.fillStyle = tint; g.fillRect(0,0,w,h);
  for (let i = 0; i < 1400; i++){ g.fillStyle = `rgba(90,80,60,${Math.random()*.035})`; g.fillRect(Math.random()*w, Math.random()*h, 1 + Math.random()*2, 1 + Math.random()*2); } }
// mini rich text: **bold**, `code`
function richLine(g, line, x, y, size, color = INK){
  const parts = line.split(/(\*\*[^*]+\*\*|`[^`]+`)/); let cx = x;
  for (const p of parts){ if (!p) continue;
    if (p.startsWith('**')){ g.font = `700 ${size}px ${SERIF}`; g.fillStyle = color; g.fillText(p.slice(2,-2), cx, y); cx += g.measureText(p.slice(2,-2)).width; }
    else if (p.startsWith('`')){ g.font = `500 ${size*.82}px ${MONO}`; const tw = g.measureText(p.slice(1,-1)).width; g.fillStyle = '#ede6d8'; g.fillRect(cx-2, y - size*.78, tw + 8, size*1.02); g.fillStyle = '#7a3b22'; g.fillText(p.slice(1,-1), cx + 2, y - size*.06); cx += tw + 10; }
    else { g.font = `400 ${size}px ${SERIF}`; g.fillStyle = color; g.fillText(p, cx, y); cx += g.measureText(p).width; } }
}
function richWrap(g, text, maxW, size){ // wrap counting styled widths approximately
  g.font = `400 ${size}px ${SERIF}`; return wrap(g, text, maxW); }

/* ---------- desk + mat ---------- */
const deskTex = canvasTex(1024, 1024, (g, w, h) => { g.fillStyle = '#e6dccb'; g.fillRect(0,0,w,h);
  for (let i = 0; i < 8; i++){ const y0 = i*h/8; g.fillStyle = i % 2 ? '#e2d6c2' : '#e9dfcf'; g.fillRect(0, y0, w, h/8); g.strokeStyle = '#cdbfa8'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, y0); g.lineTo(w, y0); g.stroke();
    for (let k = 0; k < 26; k++){ g.strokeStyle = `rgba(150,120,80,${.05 + Math.random()*.07})`; g.lineWidth = 1 + Math.random()*1.5; g.beginPath(); const yy = y0 + Math.random()*h/8; g.moveTo(0, yy);
      for (let x = 0; x <= w; x += 64) g.lineTo(x, yy + Math.sin(x/90 + k)*3 + Math.random()*1.5); g.stroke(); } } });
deskTex.wrapS = deskTex.wrapT = THREE.RepeatWrapping; deskTex.repeat.set(3, 3);
const desk = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshLambertMaterial({ map:deskTex })); desk.rotation.x = -Math.PI/2; desk.position.y = -.012; desk.receiveShadow = true; scene.add(desk);
const matTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#9fb3a8'; g.fillRect(0,0,w,h); for (let i = 0; i < 3000; i++){ g.fillStyle = `rgba(255,255,255,${Math.random()*.05})`; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); } });
const mat = new THREE.Mesh(new RoundedBoxGeometry(4.6, .01, 3.2, 3, .005), new THREE.MeshLambertMaterial({ map:matTex })); mat.position.set(0, -.006, .05); mat.receiveShadow = true; scene.add(mat);

/* ---------- the book ---------- */
const book = new THREE.Group(); scene.add(book);
const COVER = new THREE.MeshLambertMaterial({ color:CLAY });
const MASCOT_IMG = new Image();
const coverTex = canvasTex(1100, 1500, drawCover);
function drawCover(g, w, h){
  g.fillStyle = CLAY; g.fillRect(0,0,w,h);
  for (let i = 0; i < 9000; i++){ g.fillStyle = `rgba(${Math.random() < .5 ? '255,240,220' : '80,30,10'},${Math.random()*.05})`; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  g.strokeStyle = '#f6e7d8'; g.lineWidth = 3; g.strokeRect(60, 60, w-120, h-120);
  g.fillStyle = '#fbf2e6'; g.font = `600 30px ${MONO}`; g.textAlign = 'left'; g.fillText('AN UNOFFICIAL POP-UP FIELD GUIDE', 110, 160);
  g.font = `700 150px ${SERIF}`; g.fillText('Claude', 104, 330); g.fillText('Code', 104, 470); g.font = `italic 600 150px ${SERIF}`; g.fillText('Chips', 104, 610);
  g.font = `400 40px ${SERIF}`; g.fillStyle = '#fff3e4'; wrap(g, 'Agents, the chips they run on, and how to keep the token bill small.', 820).forEach((l, i) => g.fillText(l, 110, 700 + i*52));
  // a little board of chips
  const ox = 140, oy = 900, cs = 120;
  const chipC = ['#2b2620', '#3b82f6', '#8b5cf6', '#22c55e', '#e9b949', '#fbf2e6'];
  for (let i = 0; i < 6; i++){ const x = ox + (i % 3)*(cs + 70), y = oy + Math.floor(i/3)*(cs + 70);
    g.fillStyle = chipC[i]; g.fillRect(x, y, cs, cs); g.strokeStyle = '#2b2620'; g.lineWidth = 4; g.strokeRect(x, y, cs, cs);
    g.fillStyle = '#2b2620'; for (let k = 0; k < 4; k++){ g.fillRect(x + 18 + k*26, y - 16, 8, 16); g.fillRect(x + 18 + k*26, y + cs, 8, 16); g.fillRect(x - 16, y + 18 + k*26, 16, 8); g.fillRect(x + cs, y + 18 + k*26, 16, 8); } }
  if (MASCOT_IMG.complete && MASCOT_IMG.naturalWidth){ const mw = 260, mh = mw*MASCOT_IMG.naturalHeight/MASCOT_IMG.naturalWidth, mx = w - mw - 130, my = h - mh - 190;
    g.fillStyle = '#fbf2e6'; g.beginPath(); g.roundRect(mx - 40, my - 40, mw + 80, mh + 80, 30); g.fill(); g.strokeStyle = '#2b2620'; g.lineWidth = 4; g.stroke(); g.drawImage(MASCOT_IMG, mx, my, mw, mh); }
  g.fillStyle = '#fbf2e6'; g.font = `600 26px ${MONO}`; g.fillText('VOL. 1  ·  TOKENS, CHIPS, COSTS', 110, h - 110);
}
MASCOT_IMG.onload = () => coverTex.redraw(); MASCOT_IMG.src = MASCOT;

// right half (fixed): back cover, page block, right page
const backCover = M(new RoundedBoxGeometry(PW + .045, .024, PH + .07, 2, .006), COVER, false); at(backCover, PW/2 + .01, .012, 0); book.add(backCover);
const blockR = M(new THREE.BoxGeometry(PW - .01, .05, PH - .012), PAPER2, true); at(blockR, PW/2 + .002, .024 + .025, 0); book.add(blockR);
for (let i = 1; i < 6; i++){ const l = new THREE.Mesh(new THREE.BoxGeometry(.0008, .049, PH - .016), new THREE.MeshBasicMaterial({ color:'#d8d1c3' })); }
const rightTex = canvasTex(1400, 1904, (g, w, h) => paperBg(g, w, h));
const rightPage = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshLambertMaterial({ map:rightTex })); rightPage.rotation.x = -Math.PI/2; at(rightPage, PW/2, BASE_Y, 0); rightPage.receiveShadow = true; book.add(rightPage);
// spine crease shadow
const crease = new THREE.Mesh(new THREE.PlaneGeometry(.08, PH), new THREE.MeshBasicMaterial({ transparent:true, opacity:.22, map:canvasTex(64, 8, (g, w) => { const gr = g.createLinearGradient(0,0,w,0); gr.addColorStop(0,'rgba(60,40,20,0)'); gr.addColorStop(.5,'rgba(60,40,20,1)'); gr.addColorStop(1,'rgba(60,40,20,0)'); g.fillStyle = gr; g.fillRect(0,0,w,8); }), depthWrite:false }));
crease.rotation.x = -Math.PI/2; at(crease, 0, BASE_Y + .0012, 0); book.add(crease);
// left half: pivots on the spine at the page surface; rotation.z = -theta closes it over the right half
const leftHalf = new THREE.Group(); at(leftHalf, 0, BASE_Y, 0); book.add(leftHalf);
const frontCover = new THREE.Mesh(new RoundedBoxGeometry(PW + .045, .024, PH + .07, 2, .006), [COVER, COVER, COVER, new THREE.MeshLambertMaterial({ map:coverTex }), COVER, COVER]);
frontCover.castShadow = frontCover.receiveShadow = true; at(frontCover, -PW/2 - .01, -BASE_Y + .012, 0); leftHalf.add(frontCover);
coverTex.center.set(.5, .5); coverTex.rotation = Math.PI;

    // the hook: a funnel that filters a long log down to the errors
    const funnel = new THREE.Group(); funnel.add(at(M(new THREE.CylinderGeometry(.08, .012, .12, 28, 1, true), hatchMat('#e9e4da', { side:THREE.DoubleSide })), 0, .14, 0));

    const log = new THREE.Group(); for (let i = 0; i < 6; i++){ const s = M(new THREE.BoxGeometry(.12, .004, .16), PAPER); s.position.set(0, .21 + i*.006, 0); s.rotation.y = i*.08; log.add(s); } funnel.add(log);
    const err = labelCard(.11, .05, (g, w, h) => { g.fillStyle = '#fff1ee'; g.fillRect(0,0,w,h); g.fillStyle = '#c0392b'; g.font = `700 ${h*.36}px ${MONO}`; g.fillText('2 ERRORS', 14, h*.66); }); at(err, .1, .004, .07); err.visible = false; funnel.add(err);
    at(funnel, .7, 0, .17); G.add(funnel); let filtered = false;

      { cap:'Slim CLAUDE.md, move workflows to skills.', focus:thick, act:() => thick.userData.tap.onTap() },
      { cap:'Filter noisy output with a hook.', focus:funnel, act:() => funnel.userData.tap.onTap() },

  } });

LESSONS.push({ n:5, title:'The crew', fig:'Seven agents, one team meter.', tapHint:'Tap an agent to spawn it. Tap again to shut it down.',
  intro:['An agent team runs several Claude Code sessions at once, each a teammate with **its own context window**. Spend grows with every teammate you spawn.',

  eq:'team tokens ≈ teammates × their own context',
  eqNotes:['Each teammate loads CLAUDE.md, MCP servers and skills on its own.', 'With teammates in plan mode, a team can use about 7× the tokens of one session.'],
  keys:[['agent team','several Claude Code instances on one job'], ['teammate','one member, with its own context window'], ['spawn prompt','what a teammate starts with: keep it short'], ['shut down','stop a finished teammate so it stops spending']],

/* ---------- current lesson / scene ---------- */
let cur = -1, popup = null, ST = { pick:null, flap:false }, shots = [], shotI = 0, busy = false, opened = false;
const popupRoot = new THREE.Group(); book.add(popupRoot);
function buildLesson(i){
  if (popup){ popupRoot.remove(popup); tappables.length = 0; }
  sceneUpd = [];
  popup = new THREE.Group(); popup.position.set(0, BASE_Y, -PH/2 + .02); popup.position.z = 0; popupRoot.add(popup);
  const L = LESSONS[i]; ST = { pick:null, flap:false };
  const res = L.build(popup); shadowy(popup);
  shots = res.shots; shotI = 0; drawLeft(L, ST); drawRight(L); placeFlap(); renderDots();
  popup.scale.y = .001; return anim(.8, k => popup.scale.y = Math.max(.001, k), null, easeBack);
}
async function goTo(i, instant){
  if (busy || i === cur || i < 0 || i >= LESSONS.length) return; busy = true; stopTour();
  if (!opened){ await openBook(); }
  const dir = i > cur ? 1 : -1;
  if (cur >= 0 && !instant){
    await anim(.35, k => popup.scale.y = Math.max(.001, 1 - k));
    // page turn: forward = right page lifts and lands on the left; backward = the reverse
    const oldRight = snap(rightTex), oldLeft = snap(leftTex);
    const L = LESSONS[i];
    cur = i; drawLeft(L, { pick:null, flap:false }); const newLeft = snap(leftTex); drawRight(L); const newRight = snap(rightTex);
    if (dir > 0){ turnFront.material.map = oldRight; turnBack.material.map = newLeft; leftTex.redraw(() => {}); leftTex.userData.cv.getContext('2d').drawImage(oldLeft.image, 0, 0); leftTex.needsUpdate = true; }
    else { turnFront.material.map = newRight; turnBack.material.map = oldLeft; rightTex.userData.cv.getContext('2d').drawImage(oldRight.image, 0, 0); rightTex.needsUpdate = true; }
    turnFront.material.needsUpdate = turnBack.material.needsUpdate = true; turn.visible = true; flap.visible = false; sfx('page');
    const a0 = dir > 0 ? 0 : Math.PI, a1 = dir > 0 ? Math.PI : 0;
    await anim(.9, k => { turn.rotation.z = a0 + (a1 - a0)*k; bend(Math.sin(k*Math.PI)*dir); });
    turn.visible = false; flap.visible = true;
    cur = -1;
  }
  cur = i; await buildLesson(i); captionLesson(); busy = false;
  if (!instant) flyTo(...frameFor('open'), 1.1);
}
function bend(a){ for (const m of [turnFront, turnBack]){ const p = m.geometry.attributes.position; for (let j = 0; j < p.count; j++){ const x = p.getX(j) + PW/2; p.setZ(j, (m === turnFront ? 1 : -1)*-Math.sin(x/PW*Math.PI)*.12*a); } p.needsUpdate = true; } }
async function openBook(){
  opened = true; document.getElementById('hint').classList.add('gone'); document.getElementById('intro').classList.add('gone'); sfx('page');
  flyTo([0, 2.15, 2.1], [0, 0, .05], 1.6);
  await anim(1.4, k => { leftHalf.rotation.z = -Math.PI*(1 - k); leftHalf.position.y = BASE_Y + Math.sin(k*Math.PI)*.04; });
  leftHalf.position.y = BASE_Y;
}
function closeToCover(){ leftHalf.rotation.z = -Math.PI; }

/* ---------- camera ---------- */
function frameFor(kind){ const portrait = innerWidth < innerHeight*.9;
  if (kind === 'closed') return portrait ? [[.5, 2.4, 2.7], [.5, 0, .05]] : [[.5, 2.05, 2.25], [.5, 0, .05]];
  return portrait ? [[0, 4.3, 3.3], [0, 0, .12]] : [[0, 2.15, 2.1], [0, 0, .05]]; }
function flyTo(pos, tgt, dur = 1.2){ const p0 = camera.position.clone(), t0 = controls.target.clone(), p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...tgt);
  // positions are in book space: the book sits at the origin
  return anim(dur, k => { camera.position.lerpVectors(p0, p1, k); controls.target.lerpVectors(t0, t1, k); }); }
function focusOn(obj){ const p = new THREE.Vector3(); obj.getWorldPosition(p); return flyTo([p.x + .1, p.y + .42, p.z + .52], [p.x, p.y + .05, p.z], 1.1); }

/* ---------- tour (play) ---------- */
let touring = false, tourTimer = null;
async function tourStep(){
  if (!touring) return;
  if (shotI >= shots.length){ if (cur < LESSONS.length - 1){ await goTo(cur + 1); shotI = 1; tourTimer = setTimeout(tourStep, 1600); } else stopTour(); return; }
  const s = shots[shotI]; renderDots(); caption(s.cap);
  if (s.focus) await focusOn(s.focus); else await flyTo(s.cam, s.tgt, 1.2);
  if (s.act) s.act();
  shotI++; tourTimer = setTimeout(tourStep, (s.hold || 2.4)*1000);
}
function startTour(){ touring = true; setPlay(); if (!opened || cur < 0){ goTo(0).then(() => { shotI = 0; tourStep(); }); } else tourStep(); }
function stopTour(){ touring = false; clearTimeout(tourTimer); setPlay(); }
function setPlay(){ document.getElementById('playIcon').innerHTML = touring ? '<path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" stroke="none"/>' : '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>'; document.getElementById('bPlay').setAttribute('aria-pressed', touring); }

/* ---------- toolbar ---------- */
const capT = document.getElementById('capT');
let capTimer = null;
function caption(t){ capT.textContent = t; clearTimeout(capTimer); if (!touring) capTimer = setTimeout(captionLesson, 5000); }
function captionLesson(){ capT.textContent = cur >= 0 ? `${LESSONS[cur].n}  ${LESSONS[cur].title}` : 'Claude Code Chips'; }
function renderDots(){ document.getElementById('dots').innerHTML = shots.map((_, i) => `<i class="${i === Math.max(0, shotI - (touring ? 1 : 0)) && touring ? 'on' : ''}"></i>`).join('') || ''; }
const menu = document.getElementById('menu');
function renderMenu(){ menu.innerHTML = `<button data-i="-1" class="${cur < 0 ? 'cur' : ''}"><small>COVER</small>Claude Code Chips</button>` + LESSONS.map((L, i) => `<button data-i="${i}" class="${i === cur ? 'cur' : ''}"><small>LESSON ${L.n}</small>${L.title}</button>`).join('')
  + `<div class="foot">An unofficial guide. Prices: Claude API list prices for the 5.5 models; check current pricing before you budget.</div>`;
  menu.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); menu.classList.remove('open'); const i = +b.dataset.i; if (i < 0){ if (opened && !busy) shut(); } else goTo(i); }); }
async function shut(){ busy = true; stopTour(); await anim(.3, k => popup && (popup.scale.y = Math.max(.001, 1 - k))); if (popup){ popupRoot.remove(popup); popup = null; tappables.length = 0; sceneUpd = []; }
  flyTo(...frameFor('closed'), 1.4); sfx('page'); await anim(1.2, k => leftHalf.rotation.z = -Math.PI*k); opened = false; cur = -1; captionLesson(); busy = false; document.getElementById('hint').classList.remove('gone'); }
document.getElementById('bMenu').onclick = e => { e.stopPropagation(); ac(); renderMenu(); menu.classList.toggle('open'); };
document.addEventListener('click', () => menu.classList.remove('open'));
document.getElementById('bPrev').onclick = () => { ac(); if (cur <= 0){ if (opened) shut(); } else goTo(cur - 1); };
document.getElementById('bNext').onclick = () => { ac(); goTo(cur + 1); };
document.getElementById('bPlay').onclick = () => { ac(); touring ? stopTour() : startTour(); };
document.getElementById('bSound').onclick = e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); document.getElementById('sndWave').style.opacity = soundOn ? 1 : 0; };
document.getElementById('bView').onclick = () => { stopTour(); flyTo(...frameFor(opened ? 'open' : 'closed'), 1); };
let night = false;
function setNight(v){ night = v; document.documentElement.dataset.theme = v ? 'dark' : 'light';
  hemi.intensity = v ? .35 : .9; sun.intensity = v ? .55 : 2.1; sun.color.set(v ? 0xb9c8ff : 0xfff1dc); fill.intensity = v ? .15 : .35; renderer.toneMappingExposure = v ? .95 : 1.05;
  lamp.intensity = v ? 3.2 : 0; scene.background = new THREE.Color(v ? '#141210' : '#cfc6b6'); scene.fog = new THREE.Fog(v ? '#141210' : '#cfc6b6', 6, 16); }
document.getElementById('bTheme').onclick = () => setNight(!night);
const lamp = new THREE.PointLight(0xffd59a, 0, 6, 1.6); lamp.position.set(-1.6, 1.6, -.6); lamp.castShadow = true; scene.add(lamp);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') goTo(cur + 1); if (e.key === 'ArrowLeft') document.getElementById('bPrev').click(); if (e.key === ' '){ e.preventDefault(); document.getElementById('bPlay').click(); } });

/* ---------- pointer: tap objects, predict, flap, lens ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const lens = { el:document.getElementById('lens'), on:false }; let lensImg = null, cardTimer = null, cardBlock = null;
const cardEl = document.getElementById('card');
function pick(e){ ptr.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1); ray.setFromCamera(ptr, camera); }
function hitTappable(){ const hits = ray.intersectObjects(tappables, true); for (const h of hits){ let o = h.object; while (o && !o.userData.tap) o = o.parent; if (o) return o; } return null; }
function hitLeft(){ if (!opened || busy) return null; const hits = ray.intersectObjects([leftPage, flap], false); if (!hits.length) return null; const h = hits[0];
  if (h.object === flap) return { flap:true };
  const W = leftTex.userData.cv.width, H = leftTex.userData.cv.height; return { x:h.uv.x*W, y:(1 - h.uv.y)*H }; }
const inR = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; ac(); });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return; downAt = null; pick(e);
  if (!opened){ const h = ray.intersectObject(book, true); if (h.length) goTo(0); return; }
  if (busy) return;
  const t = hitTappable(); if (t){ stopTour(); t.userData.tap.onTap(); return; }
  const L = hitLeft(); if (!L) return;
  if (L.flap || (LP.flapRect && inR(L, LP.flapRect))){ toggleFlap(); return; }
  const o = LP.options.find(o => inR(L, o.r)); if (o){ ST.pick = o.i; sfx('tap'); drawLeft(LESSONS[cur], ST); caption('Prediction made. Lift the flap to check.'); }
});
canvas.addEventListener('pointermove', e => {
  pick(e); const t = opened && !busy ? hitTappable() : null;
  if (t !== hovered){ if (hovered) liftHover(hovered, false); hovered = t; if (t) liftHover(t, true); }
  const L = !t && opened ? hitLeft() : null;
  const overOpt = L && !L.flap && (LP.options.some(o => inR(L, o.r)) || (LP.flapRect && inR(L, LP.flapRect)));
  canvas.style.cursor = t || overOpt || (L && L.flap) || (!opened && ray.intersectObject(book, true).length) ? 'pointer' : 'grab';
  // the magnifying lens over the left page text
  if (L && !L.flap && innerWidth > 640){
    if (!lensImg){ lensImg = leftTex.userData.cv.toDataURL('image/jpeg', .85); lens.el.style.backgroundImage = `url(${lensImg})`; }
    const Z = 1.15, W = leftTex.userData.cv.width, size = lens.el.offsetWidth;
    lens.el.style.backgroundSize = `${W*Z/1.4*size/168*1.4/1.4}px auto`;
    const bgW = W*Z*size/700; lens.el.style.backgroundSize = `${bgW}px auto`; const sc = bgW/W;
    lens.el.style.backgroundPosition = `${-(L.x*sc - size/2)}px ${-(L.y*sc - size/2)}px`;
    lens.el.style.left = e.clientX + 'px'; lens.el.style.top = e.clientY + 'px'; lens.el.classList.add('on'); lens.on = true;
    const blk = LP.blocks.find(b => inR(L, b.r) && !(b.flap && !flapOpen));
    if (blk !== cardBlock){ cardBlock = blk; cardEl.classList.remove('on'); clearTimeout(cardTimer); if (blk) cardTimer = setTimeout(() => showCard(blk, e), 450); }
    else if (blk) placeCard(e);
  } else { lens.el.classList.remove('on'); lens.on = false; cardBlock = null; clearTimeout(cardTimer); cardEl.classList.remove('on'); }
});
canvas.addEventListener('pointerleave', () => { lens.el.classList.remove('on'); cardEl.classList.remove('on'); cardBlock = null; });
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
function showCard(b, e){ cardEl.innerHTML = `<div class="k">${b.k}</div>${b.h ? `<div class="h">${md(b.h)}</div>` : ''}${b.body.map(p => `<p>${md(p)}</p>`).join('')}`; placeCard(e); cardEl.classList.add('on'); }
function placeCard(e){ const r = cardEl.getBoundingClientRect(); let x = e.clientX - r.width - 100, y = e.clientY - r.height/2; if (x < 12) x = e.clientX + 100; y = Math.max(12, Math.min(innerHeight - r.height - 90, y)); cardEl.style.left = x + 'px'; cardEl.style.top = y + 'px'; }
function liftHover(o, on){ const y0 = o.userData.y0 ?? (o.userData.y0 = o.position.y); if (o.userData.noLift) return; anim(.18, k => o.position.y = on ? y0 + .012*k : y0 + .012*(1 - k)); }

/* ---------- resize + loop ---------- */
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < h ? 42 : 32; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
book.position.set(0, 0, 0);
let lastNow = 0;
function loop(now){ const dt = Math.min(.05, lastNow ? (now - lastNow)/1000 : .016); lastNow = now; tickAnims(now); for (const u of sceneUpd) u(dt, now/1000); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); }

/* ---------- start ---------- */
closeToCover();
const [cp, ct] = frameFor('closed'); camera.position.set(...cp); controls.target.set(...ct);
setNight(matchMedia('(prefers-color-scheme: dark)').matches && !qs.has('day'));
(async () => {
  try { await Promise.race([Promise.all([document.fonts.load(`700 40px Newsreader`), document.fonts.load(`400 40px Newsreader`), document.fonts.load(`italic 600 40px Newsreader`), document.fonts.load(`700 20px "JetBrains Mono"`)]), wait(2.5)]); } catch (e) {}
  coverTex.redraw(); renderMenu(); captionLesson();
  requestAnimationFrame(loop); setTimeout(() => document.getElementById('load').classList.add('gone'), 250);
  // screenshot states: ?lesson=2&tap=all&flap=1&pick=1&view=right
  if (qs.has('lesson')){ const i = +qs.get('lesson') - 1; leftHalf.rotation.z = 0; opened = true; document.getElementById('hint').classList.add('gone'); document.getElementById('intro').classList.add('gone');
    cur = i; await buildLesson(i); captionLesson(); const [p, t] = frameFor('open'); camera.position.set(...p); controls.target.set(...t);
    if (qs.has('pick')){ ST.pick = +qs.get('pick'); drawLeft(LESSONS[cur], ST); }
    if (qs.get('flap') === '1') toggleFlap(true);
    if (qs.get('view') === 'right'){ camera.position.set(...shots[0].cam); controls.target.set(...shots[0].tgt); }
    if (qs.get('tap') === 'all') for (const s of shots) if (s.act){ s.act(); await wait(.25); }
  }
  window.__ready = true;
})();
window.__api = { goTo, toggleFlap, startTour, stopTour, get cur(){ return cur; }, camera, controls, LESSONS,
  names(){ return tappables.map(t => t.userData.tap.name); },
  screenOf(name){ const o = tappables.find(t => t.userData.tap.name === name); if (!o) return null; const v = new THREE.Vector3(); o.getWorldPosition(v); v.y += .03; v.project(camera); return [(v.x + 1)/2*innerWidth, (1 - v.y)/2*innerHeight]; },
  leftAt(u, v){ const p = new THREE.Vector3(-PW + u*PW, BASE_Y, -PH/2 + v*PH).project(camera); return [(p.x + 1)/2*innerWidth, (1 - p.y)/2*innerHeight]; } };
</script>
